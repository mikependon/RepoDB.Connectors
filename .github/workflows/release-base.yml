name: Release Base

on:
  workflow_call:
    inputs:
      package-name:
        description: "Display name of the package being published (used in the job name)"
        required: true
        type: string
      project-path:
        description: "Path to the .csproj file to restore, build, pack, and publish"
        required: true
        type: string
      version:
        description: "Package version to publish (e.g. 1.0.0)"
        required: true
        type: string
      dotnet-version:
        description: ".NET SDK version to install"
        required: false
        type: string
        default: "10.0.x\n11.0.x"

jobs:
  publish:
    name: Publish ${{ inputs.package-name }}
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore ${{ inputs.project-path }}

      - name: Build
        run: dotnet build ${{ inputs.project-path }} -c Release --no-restore

      - name: Pack
        run: dotnet pack ${{ inputs.project-path }} -c Release --no-build -o artifacts -p:Version=${{ inputs.version }}

      - name: Login to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: mikependon

      - name: Publish
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
